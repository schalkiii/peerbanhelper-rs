[package]
name = "pbh-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum HTTP API and static WebUI hosting"

[dependencies]
pbh-core = { workspace = true }
pbh-db = { workspace = true }
pbh-downloader = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ipnet = { workspace = true }
rand = { workspace = true }
# 系统内存查询（`/api/general/status` 的 jvm.memory 段；WebUI 首页「堆内存信息」）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_SystemInformation", "Win32_Foundation"] }

[dev-dependencies]
# 端点测试用 `Router::oneshot`（tower 本就是 axum 的传递依赖，版本已在 Cargo.lock 中）
tower = { version = "0.5", features = ["util"] }
