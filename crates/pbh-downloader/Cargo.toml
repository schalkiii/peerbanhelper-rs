[package]
name = "pbh-downloader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Downloader abstraction and qBittorrent adapter"

[dependencies]
pbh-core = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ipnet = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
pbkdf2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# 下载器发现：GetExtendedTcpTable 枚举本机 TCP LISTEN 端点
windows-sys = { version = "0.52", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation"] }
